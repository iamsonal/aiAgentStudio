name: CLA

# Checks that every author of a pull request has signed the Pluto Contributor
# License Agreement (CLA.md). An author signs by posting the sign comment on
# the pull request. Signatures are kept in signatures/cla.json on the
# cla-signatures branch, so the check never pushes to main.
#
# This uses pull_request_target so it can comment on pull requests from forks.
# It never checks out or runs code from the pull request.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the Pluto CLA and I agree to it.'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/iamsonal/aiAgentStudio/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'iamsonal,dependabot[bot],github-actions[bot]'
          custom-pr-sign-comment: 'I have read the Pluto CLA and I agree to it.'
          custom-notsigned-prcomment: >-
            Thank you for your pull request. Before it can be merged, each
            author must sign the [Pluto Contributor License Agreement](https://github.com/iamsonal/aiAgentStudio/blob/main/CLA.md).
            To sign, read it, then post the comment below on this pull request.
            You sign once, and it covers your later pull requests.
          custom-allsigned-prcomment: 'Every author has signed the Pluto CLA.'
          lock-pullrequest-aftermerge: false
