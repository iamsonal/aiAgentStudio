<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pluto"><style>.eyes{animation:glance 9s ease-in-out infinite}.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes glance{0%,55%,75%,100%{transform:translate(0,0)}60%,70%{transform:translate(3px,-3px)}}@media (prefers-reduced-motion:reduce){.eyes,.eye{animation:none}}</style><circle cx="30" cy="34" r="25" fill="#0176D3"/><g class="eyes"><rect class="eye" x="18" y="27" width="7" height="12" rx="3.5" fill="#FFFFFF"/><rect class="eye" x="33" y="27" width="7" height="12" rx="3.5" fill="#FFFFFF"/></g><circle cx="55" cy="9" r="5" fill="#F2B233"/></svg>
