<template>
    <div class="slds-form-element">
        <span class={labelClass}>
            <template if:true={required}><abbr class="slds-required" title="required">*</abbr></template>
            {label}
        </span>
        <template if:true={disabled}>
            <pre class="json-view" tabindex="0" aria-label={frameTitle}>{formattedValue}</pre>
        </template>
        <template if:false={disabled}>
            <div class={editorClass}>
                <iframe class="editor-frame" src={editorSrc} title={frameTitle} sandbox="allow-scripts allow-same-origin" onload={handleIframeLoad}></iframe>
            </div>
            <div class="editor-actions">
                <lightning-button label="Format JSON" variant="base" onclick={handleFormat}></lightning-button>
            </div>
        </template>
        <template if:true={validationMessage}>
            <div class="slds-form-element__help slds-text-color_error" role="alert">{validationMessage}</div>
        </template>
    </div>
</template>
