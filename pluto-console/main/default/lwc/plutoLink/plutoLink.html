<template>
    <template lwc:if={isIcon}>
        <a class="link link_icon" href={href} title={label} onclick={handleClick}>
            <lightning-icon icon-name={iconName} size="xx-small" alternative-text={label} class="link-icon"></lightning-icon>
        </a>
    </template>
    <template lwc:elseif={isButton}>
        <a class="slds-button slds-button_neutral" href={href} onclick={handleClick}>{label}</a>
    </template>
    <template lwc:else>
        <a class="link" href={href} title={title} onclick={handleClick}>{label}</a>
    </template>
</template>
