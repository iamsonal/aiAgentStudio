<template>
    <lightning-modal-header label={title}></lightning-modal-header>
    <lightning-modal-body>
        <template lwc:if={isAgent}>
            <c-pluto-agent-detail
                record-id={recordId}
                is-new={isNew}
                mode="edit"
                hide-header
                variant="modal"
                default-values={defaultValues}
                onrecordsaved={handleSaved}
                onrecordcancel={handleCancel}
                onmodechange={handleCancel}></c-pluto-agent-detail>
        </template>
        <template lwc:if={isTool}>
            <c-pluto-tool-detail
                record-id={recordId}
                is-new={isNew}
                mode="edit"
                hide-header
                variant="modal"
                default-values={defaultValues}
                onrecordsaved={handleSaved}
                onrecordcancel={handleCancel}
                onmodechange={handleCancel}></c-pluto-tool-detail>
        </template>
        <template lwc:if={isContextProvider}>
            <c-pluto-context-provider-detail
                record-id={recordId}
                is-new={isNew}
                mode="edit"
                hide-header
                variant="modal"
                default-values={defaultValues}
                onrecordsaved={handleSaved}
                onrecordcancel={handleCancel}
                onmodechange={handleCancel}></c-pluto-context-provider-detail>
        </template>
        <template lwc:if={isExecutionIdentity}>
            <c-pluto-execution-identity-detail
                record-id={recordId}
                is-new={isNew}
                mode="edit"
                hide-header
                variant="modal"
                default-values={defaultValues}
                onrecordsaved={handleSaved}
                onrecordcancel={handleCancel}
                onmodechange={handleCancel}></c-pluto-execution-identity-detail>
        </template>

        <template lwc:if={isApprovalRoute}>

                record-id={recordId}
                is-new={isNew}
                mode="edit"
                hide-header
                variant="modal"
                default-values={defaultValues}
                onrecordsaved={handleSaved}
                onrecordcancel={handleCancel}
                onmodechange={handleCancel}></c-pluto-approval-route-detail>
        </template>
        <template lwc:if={isChannelRoute}>
            <c-pluto-channel-route-detail
                record-id={recordId}
                is-new={isNew}
                mode="edit"
                hide-header
                variant="modal"
                default-values={defaultValues}
                onrecordsaved={handleSaved}
                onrecordcancel={handleCancel}
                onmodechange={handleCancel}></c-pluto-channel-route-detail>
        </template>
        -->

</template>
