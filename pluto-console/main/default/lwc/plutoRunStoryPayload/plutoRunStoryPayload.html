<template>
    <section class="payload" aria-label={label}>
        <div class="payload-head">
            <h4 class="payload-label">{label}</h4>
            <template lwc:if={hasValue}>
                <lightning-button-icon
                    icon-name={copyIcon}
                    variant="bare"
                    size="small"
                    alternative-text={copyText}
                    title={copyText}
                    onclick={handleCopy}></lightning-button-icon>
            </template>
        </div>
        <template lwc:if={copyFailed}>
            <p class="payload-copy-error" role="status">{copyText}</p>
        </template>
        <template lwc:if={hasValue}>
            <pre
                class="json"
                tabindex="0"><template for:each={highlighted.tokens} for:item="token"><span key={token.key} class={token.cls}>{token.value}</span></template></pre>
        </template>
        <template lwc:else>
            <p class="payload-empty">{emptyText}</p>
        </template>
        <template lwc:if={hasSensitive}>
            <p class="payload-note">
                <lightning-icon icon-name="utility:lock" size="xx-small" class="payload-note-icon"></lightning-icon>
                Highlighted values are tokens that stand in for sensitive data. The model only ever gets the token, never the real value.
            </p>
        </template>
    </section>
</template>
