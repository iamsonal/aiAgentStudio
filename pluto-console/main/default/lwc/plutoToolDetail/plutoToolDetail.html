<template>
    <template if:true={hasSelection}>
        <template if:true={showAssistant}>
            <c-pluto-record-layout
                record-id={recordId}
                object-api-name={objectApiName}
                hidden-fields={hiddenFields}
                additional-fields={additionalFields}
                slot-section="Tool Authoring"
                required-fields={requiredFields}
                field-dependencies={fieldDependencies}
                field-options={fieldOptions}
                default-values={defaultValues}
                custom-field-renderers={customFieldRenderers}
                mode={effectiveMode}
                hide-header={hideHeader}
                variant={variant}
                onfieldchange={handleFieldChange}
                defer-save
                onedit={handleEdit}
                onsave={handleSave}
                onsaverequest={handleSaveRequest}
                oncancel={handleCancel}>
                <div slot="form-sections-after" class="slds-p-around_small">
                    <c-tool-authoring-editor bare record-id={recordId} editing={isToolEditing}></c-tool-authoring-editor>
                </div>
            </c-pluto-record-layout>
        </template>
    </template>
    <template if:false={hasSelection}>
        <p class="slds-p-horizontal_small slds-text-color_weak">Select a tool above to view its details.</p>
    </template>
</template>
