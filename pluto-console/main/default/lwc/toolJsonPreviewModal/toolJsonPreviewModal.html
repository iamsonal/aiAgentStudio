<template>
    <lightning-modal-header label="What the model is sent"></lightning-modal-header>
    <lightning-modal-body>
        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
            The exact input schema the model receives for this tool, with your edits applied. The model sends only these inputs.
        </p>
        <template if:true={hasSchema}>
            <c-tool-json-read-only-preview label="Input schema" value={inputSchema} height="60vh"></c-tool-json-read-only-preview>
        </template>
        <template if:false={hasSchema}>
            <p class="slds-text-color_weak">{emptyMessage}</p>
        </template>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label="Close" onclick={handleClose}></lightning-button>
    </lightning-modal-footer>
</template>
