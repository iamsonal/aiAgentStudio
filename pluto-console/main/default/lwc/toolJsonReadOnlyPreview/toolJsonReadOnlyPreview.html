<template>
    <section class="json-preview" aria-label={label}>
        <div class="json-preview__header">
            <div>
                <h3 class="json-preview__title">{label}</h3>
                <p class="json-preview__description">{description}</p>
            </div>
            <div class="json-preview__actions">
                <lightning-button-icon
                    icon-name="utility:copy"
                    alternative-text={copyLabel}
                    title={copyLabel}
                    variant="border-filled"
                    onclick={handleCopy}></lightning-button-icon>
            </div>
        </div>
        <div class="json-preview__code" style={containerStyle}>
            <pre>{formattedValue}</pre>
        </div>
    </section>
</template>
