<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="./lib/codemirror.css" />
        <style>
            html, body { height: 100%; margin: 0; }
            .CodeMirror { height: 100%; font: 13px/1.5 SFMono-Regular, Consolas, 'Liberation Mono', monospace; }
            .CodeMirror-lines { padding: 8px 0; }
            .CodeMirror pre.CodeMirror-line, .CodeMirror pre.CodeMirror-line-like { padding: 0 12px; }
            textarea { box-sizing: border-box; width: 100%; height: 100%; padding: 8px 12px; border: 0; resize: none; font: 13px/1.5 monospace; }
        </style>
    </head>
    <body>
        <textarea id="editor" aria-label="JSON configuration" spellcheck="false"></textarea>
        <script src="./lib/codemirror.js"></script>
        <script src="./mode/javascript/javascript.js"></script>
        <script src="./addon/edit/matchbrackets.js"></script>
        <script src="./addon/edit/closebrackets.js"></script>
        <script src="./editor.js"></script>
    </body>
</html>
